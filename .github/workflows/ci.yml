name: CI

on:
  push:
    branches: [main, feat/ui-ux, prod-readiness]
  pull_request:
    branches: [main, prod-readiness]
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (mobile app)
        run: npx expo lint

      - name: Run TypeScript typecheck (all workspaces)
        run: npm run typecheck:all

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: weyro
          POSTGRES_PASSWORD: weyro_dev_password
          POSTGRES_DB: weyro_db
        options: >-
          --health-cmd "pg_isready -U weyro -d weyro_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Build API
        run: npm run build:api

      - name: Run Prisma migrations
        run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://weyro:weyro_dev_password@localhost:5432/weyro_db?schema=public

      - name: Run API tests
        run: npm run test -w @weyro/api
        env:
          DATABASE_URL: postgresql://weyro:weyro_dev_password@localhost:5432/weyro_db?schema=public
          JWT_ACCESS_SECRET: test_access_secret_min_32_chars_long
          JWT_REFRESH_SECRET: test_refresh_secret_min_32_chars_long

      - name: Run PostGIS e2e tests
        run: npm run test:e2e -w @weyro/api
        env:
          DATABASE_URL: postgresql://weyro:weyro_dev_password@localhost:5432/weyro_db?schema=public
          JWT_ACCESS_SECRET: test_access_secret_min_32_chars_long
          JWT_REFRESH_SECRET: test_refresh_secret_min_32_chars_long

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (production deps only)
        run: npm audit --omit=dev --audit-level=high || true

  expo-doctor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Doctor
        run: npx expo-doctor
