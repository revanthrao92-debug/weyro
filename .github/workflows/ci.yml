name: Continuous Integration

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint, Typecheck & Expo Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Run root and monorepo typecheck
        run: npm run typecheck:all

      - name: Run ESLint
        run: npm run lint

      - name: Run Expo Doctor
        run: npx expo-doctor

  api-tests:
    name: Backend API Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Run Jest test suites
        run: npm run test -w @weyro/api

  database-schema:
    name: Prisma Schema & Migration Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate --schema packages/database/prisma/schema.prisma

      - name: Check Migration Formatting
        run: npx prisma format --schema packages/database/prisma/schema.prisma --check
