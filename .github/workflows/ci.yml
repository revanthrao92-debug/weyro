name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  api:
    name: API • typecheck, lint, tests+coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (all workspaces)
        run: |
          npx tsc --noEmit -p apps/api/tsconfig.json
          npx tsc --noEmit -p packages/api-contracts
          npx tsc --noEmit -p packages/validation
      - name: Lint (API)
        run: npm run lint --if-present -w @weyro/api || true
      - name: Tests + coverage (thresholds enforced)
        env:
          NODE_ENV: test
        run: npx jest --coverage --silent -w @weyro/api
      - name: Dependency audit gate (critical only for now)
        # Ground rule: a real audit gate. Today 7 high findings remain that
        # need breaking upgrades (zod v4 / prisma v7). Gate on critical until
        # those land, then tighten to --audit-level=high.
        run: npm audit --audit-level=critical

  mobile:
    name: Mobile • typecheck, lint, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src --max-warnings 0
      - name: Unit tests (jest-expo)
        run: npx jest --silent
