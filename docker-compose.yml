
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: weyro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: weyro
      POSTGRES_PASSWORD: weyro_dev_password
      POSTGRES_DB: weyro_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U weyro -d weyro_db']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: weyro_api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      # Point at Supabase (or any hosted Postgres) by setting
      # SUPABASE_DATABASE_URL / SUPABASE_DIRECT_URL in the root .env.
      DATABASE_URL: ${SUPABASE_DATABASE_URL:-postgresql://weyro:weyro_dev_password@postgres:5432/weyro_db?schema=public}
      DIRECT_URL: ${SUPABASE_DIRECT_URL:-postgresql://weyro:weyro_dev_password@postgres:5432/weyro_db?schema=public}
      JWT_ACCESS_SECRET: weyro_docker_jwt_access_secret_super_key_32_chars
      JWT_REFRESH_SECRET: weyro_docker_jwt_refresh_secret_super_key_32_chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:3000,http://localhost:8081,http://localhost:19006,http://localhost:8082
      STORAGE_DRIVER: local
    depends_on:
      postgres:
        condition: service_healthy
    # M7: readiness-based healthcheck (DB ping via /api/v1/ready)
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/v1/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: weyro_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no']
    ports:
      - '6379:6379'

volumes:
  postgres_data:
